<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Multiplayer Football</title>
    <style>
        body { margin: 0; padding: 0; background: #1a252f; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #menu { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { margin-top: 0; color: #2ecc71; }
        input { padding: 12px; margin: 10px 0; border: none; border-radius: 8px; width: 85%; font-size: 16px; text-align: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #2ecc71; color: white; font-size: 16px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #27ae60; transform: scale(1.05); }
        
        #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 800px; }
        #scoreboard { display: flex; justify-content: space-between; width: 100%; background: #2c3e50; padding: 10px 20px; border-radius: 10px 10px 0 0; box-sizing: border-box; font-size: 24px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 2; }
        .score-blue { color: #3498db; }
        .score-red { color: #e74c3c; }
        
        canvas { background: #27ae60; border: 5px solid #bdc3c7; border-radius: 0 0 10px 10px; max-width: 100%; height: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #controls { margin-top: 15px; display: flex; gap: 20px; font-size: 14px; color: #95a5a6; background: #2c3e50; padding: 10px 20px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>⚽ Liga 2D Multiplayer</h1>
        <p>Mainkan di HP atau Laptop!</p>
        <input type="text" id="roomInput" placeholder="Masukkan ID Room (Misal: 123)">
        <br>
        <button onclick="createRoom()">Buat Room</button>
        <button onclick="joinRoom()">Gabung Lawan</button>
        <p id="statusMsg" style="color: #e74c3c; font-size: 14px; margin-top: 15px;"></p>
    </div>

    <div id="game-container">
        <div id="scoreboard">
            <span class="score-blue" id="scoreBlue">TIM BIRU: 0</span>
            <span style="color: #ecf0f1; font-size: 16px; align-self: center;" id="roomDisplay">Room: -</span>
            <span class="score-red" id="scoreRed">TIM MERAH: 0</span>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="controls">💻 Laptop: W A S D / Panah | 📱 HP: Sentuh & Tahan Layar</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const statusMsg = document.getElementById('statusMsg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentRoom = '';
        let gameState = {};
        let myId = '';

        function createRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if(room) socket.emit('createRoom', room);
        }
        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if(room) socket.emit('joinRoom', room);
        }

        socket.on('roomCreated', (roomId) => {
            statusMsg.style.color = "#f1c40f";
            statusMsg.innerText = `Menunggu lawan masuk ke room "${roomId}"...`;
            currentRoom = roomId;
        });

        socket.on('gameStart', (state) => {
            currentRoom = document.getElementById('roomInput').value.trim() || currentRoom;
            myId = socket.id;
            gameState = state;
            menu.style.display = 'none';
            gameContainer.style.display = 'flex';
            document.getElementById('roomDisplay').innerText = `Room: ${currentRoom}`;
            gameLoop();
        });

        socket.on('updateState', (state) => {
            gameState = state;
            document.getElementById('scoreBlue').innerText = `TIM BIRU: ${state.score.blue}`;
            document.getElementById('scoreRed').innerText = `TIM MERAH: ${state.score.red}`;
        });

        socket.on('errorMsg', (msg) => { statusMsg.innerText = msg; });
        socket.on('playerLeft', () => {
            alert("Lawan kabur dari pertandingan! Anda menang WO.");
            location.reload();
        });

        function drawField() {
            // Pola rumput gelap terang
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillStyle = (i / 40) % 2 === 0 ? "#27ae60" : "#2ecc71";
                ctx.fillRect(i, 0, 40, canvas.height);
            }

            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 3;

            // Garis Luar
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
            // Garis Tengah & Lingkaran
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI * 2); ctx.stroke();

            // Area Penalti Kiri
            ctx.strokeRect(0, 80, 120, 240);
            ctx.strokeRect(0, 130, 40, 140); // Area kiper
            // Area Penalti Kanan
            ctx.strokeRect(canvas.width - 120, 80, 120, 240);
            ctx.strokeRect(canvas.width - 40, 130, 40, 140);

            // Gawang Kiri & Kanan (Area Hitam)
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0, 150, 10, 100);
            ctx.fillRect(canvas.width - 10, 150, 10, 100);
        }

        function draw() {
            drawField();
            if(!gameState.players) return;

            // Gambar Bola
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Gambar Pemain
            for (let id in gameState.players) {
                const p = gameState.players[id];
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Border pemain bercahaya jika itu diri kita
                ctx.strokeStyle = id === myId ? "yellow" : "black";
                ctx.lineWidth = id === myId ? 4 : 2;
                ctx.stroke();
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Kontrol Input
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        setInterval(() => {
            if (!currentRoom || !gameState.players || !gameState.players[myId]) return;
            
            let p = gameState.players[myId];
            let moved = false;
            let speed = 6; // Dibuat lebih lincah

            if (keys['ArrowUp'] || keys['w']) { p.y -= speed; moved = true; }
            if (keys['ArrowDown'] || keys['s']) { p.y += speed; moved = true; }
            if (keys['ArrowLeft'] || keys['a']) { p.x -= speed; moved = true; }
            if (keys['ArrowRight'] || keys['d']) { p.x += speed; moved = true; }

            // Batas pergerakan pemain agar tidak keluar lapangan
            p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
            p.y = Math.max(20, Math.min(canvas.height - 20, p.y));

            if (moved) socket.emit('move', { roomId: currentRoom, x: p.x, y: p.y });
        }, 1000/60);

        // Kontrol Sentuh yang diperbaiki
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!currentRoom || !gameState.players || !gameState.players[myId]) return;
            
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const p = gameState.players[myId];
            
            p.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            p.y = (touch.clientY - rect.top) * (canvas.height / rect.height);

            // Batas pergerakan
            p.x = Math.max(20, Math.min(canvas.width - 20, p.x));
            p.y = Math.max(20, Math.min(canvas.height - 20, p.y));

            socket.emit('move', { roomId: currentRoom, x: p.x, y: p.y });
        }, { passive: false });
    </script>
</body>
</html>
